# familyshield.kr: PWA static files + skill server proxy (D29)
# Installed to /etc/nginx/conf.d/familyshield.kr.conf by deploy/remote/03-nginx-https.sh

# Path only, no query string: /check/result?t=<one-time token> must not reach logs (PRD 13-4)
log_format fs_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name familyshield.kr www.familyshield.kr;
    access_log /var/log/nginx/familyshield.access.log fs_noquery;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/family-shield/acme;
    }
    location / {
        return 301 https://familyshield.kr$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name familyshield.kr www.familyshield.kr;

    ssl_certificate     /etc/letsencrypt/live/familyshield.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/familyshield.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:fs_ssl:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/familyshield.access.log fs_noquery;
    server_tokens off;
    # skill server rejects bodies over 64 KB anyway
    client_max_body_size 64k;

    # Security headers (PRD 12-3). Locations below must not use add_header,
    # or nginx drops these for that location.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://sezchlnsyrdazclrbtgv.supabase.co wss://sezchlnsyrdazclrbtgv.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    if ($host = www.familyshield.kr) {
        return 301 https://familyshield.kr$request_uri;
    }

    # Skill server: /api/kakao-skill (Kakao), /api/result and /api/analyze (web)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # overwrite, not append: rate limiter trusts the first entry
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        # Kakao gives up at 5 s; web /api/analyze allows AI up to 8 s
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    root /srv/family-shield/web;

    # hashed build files never change
    location /assets/ {
        expires 1y;
    }
    # must revalidate so updates reach installed PWAs
    location = /index.html {
        expires -1;
    }
    location = /sw.js {
        expires -1;
    }
    location = /registerSW.js {
        expires -1;
    }
    location = /manifest.webmanifest {
        expires -1;
    }
    # SPA routes (/check/result, /family, ...) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
